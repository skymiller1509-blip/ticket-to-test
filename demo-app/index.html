<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticket-to-Test Demo Store</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    .card { border: 1px solid #ccc; border-radius: 12px; padding: 20px; }
    .price { font-size: 28px; font-weight: bold; }
    button { font-size: 18px; padding: 10px 18px; cursor: pointer; }
    #cart-total { font-size: 22px; font-weight: bold; }
    #status { color: #0a7a0a; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Ticket-to-Test Demo Store</h1>
  <p>One product. One checkout. Kane watches the total.</p>
  <div class="card">
    <h2 id="product-name">ShipGate Mug</h2>
    <p class="price">Price: <span id="product-price">$25.00</span></p>
    <label>Quantity:
      <input id="qty" type="number" value="1" min="1" max="9" style="font-size:18px;width:60px">
    </label>
    <br><br>
    <button id="add-to-cart">Add to cart</button>
    <p>Cart total: <span id="cart-total">$0.00</span></p>
    <p id="status"></p>
  </div>
  <script src="app.js"></script>
</body>
</html>
